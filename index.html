<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>ploxi0n</title>
  <link rel="icon" href="/icons/ploxi0n.svg">
  <!-- L'ÉCRAN DE CHARGEMENT (RS-7 12.10 : « quand on ouvre l'app, il faut un vrai écran de chargement stylé ») : en ligne dans la page, il
       se peint avant tout le reste ; main.js le fait avancer (window.__boot(pct, étape)) et le retire quand l'accueil est là. -->
  <style>
    html,body{margin:0;background:#07050c}
    #px-boot{position:fixed;inset:0;z-index:90;background:#07050c;color:#ddd6ea;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
      padding:calc(env(safe-area-inset-top,0px) + 18vh) 32px calc(env(safe-area-inset-bottom,0px) + 34px);box-sizing:border-box;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;transition:opacity .35s}
    #px-boot.fin{opacity:0;pointer-events:none}
    #px-boot .c{display:flex;flex-direction:column;align-items:center;gap:22px}
    #px-boot svg{width:118px;height:118px}
    #px-boot svg .t{fill:none;stroke:#a597cf;stroke-width:2.2;stroke-linejoin:round}
    #px-boot svg .u{fill:none;stroke:#3a3050;stroke-width:1.2;stroke-dasharray:2 5}
    #px-boot svg .n{fill:#79d9a2}
    #px-boot .m{font-weight:700;font-size:26px;letter-spacing:.32em;margin-left:.32em;color:#ddd6ea}
    #px-boot .s{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#5f5878}
    #px-boot .b{width:min(320px,78vw);display:flex;flex-direction:column;gap:9px}
    #px-boot .r{height:4px;border-radius:2px;background:#0f0b18;box-shadow:inset 0 0 0 1px #272036;overflow:hidden}
    #px-boot .r i{display:block;height:100%;width:3%;background:#a597cf;transition:width .3s}
    #px-boot .e{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:.12em;text-transform:lowercase;color:#7f7699}
    @media (prefers-reduced-motion:no-preference){ #px-boot svg .n{animation:pxb 2.4s ease-in-out infinite} #px-boot svg .u{animation:pxr 14s linear infinite;transform-origin:60px 60px} }
    @keyframes pxb{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes pxr{to{transform:rotate(360deg)}}
  </style>
  <link rel="stylesheet" href="/src/app/app.css">
</head>
<body>
  <div id="px-boot" role="status" aria-label="ploxi0n démarre">
    <div class="c">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="u" cx="60" cy="60" r="54"/>
        <path class="t" d="M60 14 L100 37 L100 83 L60 106 L20 83 L20 37 Z"/>
        <path class="t" d="M60 34 L82 60 L60 86 L38 60 Z" style="stroke-width:1.6;opacity:.7"/>
        <circle class="n" cx="60" cy="60" r="4.5"/>
      </svg>
      <div class="m">PLOXI0N</div>
      <div class="s">cycle 7026 · le xerboxion dans la poche</div>
    </div>
    <div class="b">
      <div class="r"><i id="px-boot-r"></i></div>
      <div class="e"><span id="px-boot-e">éveil</span><span id="px-boot-v"></span></div>
    </div>
  </div>
  <script>
    (function () {
      var r = document.getElementById('px-boot-r'), e = document.getElementById('px-boot-e'), p = 3;
      window.__boot = function (pct, etape) { if (pct > p) { p = Math.min(100, pct); if (r) r.style.width = p + '%'; } if (etape && e) e.textContent = etape; };
      window.__bootFin = function () { var b = document.getElementById('px-boot'); if (!b || b.classList.contains('fin')) return; window.__boot(100); b.classList.add('fin'); setTimeout(function () { b.remove(); }, 400); };
      setTimeout(window.__bootFin, 20000);   // jamais bloqué derrière l'écran de chargement
    })();
  </script>
  <main id="ploxi0n"></main>
  <script src="/vendor/jOSb.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
