# ploxi0n — un push sur main produit un build TestFlight, sans aucun Mac local (brief v1, « CI, tests et publication »).
# Les tests tournent d'abord sur Linux (minutes au tarif normal) ; le build iOS seulement s'ils passent (macOS = minutes ×10).
# Secrets à poser par RS-7 dans le dépôt (Settings › Secrets and variables › Actions), JAMAIS sur le Boxion ni dans un agent :
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (le contenu du fichier .p8), APPLE_TEAM_ID
#   signature : MATCH_PAT (jeton GitHub, Contents lecture/écriture sur J0bot/ploxi0n-certificats seulement) et MATCH_PASSWORD (la phrase qui
#   chiffre les certificats) ; TESTFLIGHT_EMAIL (l'Apple ID à inviter dans le groupe de testeurs internes) ; sans eux, la CI tente la signature automatique (qui exige un iPhone enregistré dans le compte)
name: iOS TestFlight
# (12.10, RS-7 : « on a utilisé toutes les minutes Actions jusqu'au 1er novembre ») plus de build à CHAQUE push (≈ 45 builds macOS
# ce mois, minutes ×10) : seulement sur un tag v* (git tag v0.46 && git push --tags) ou à la main (workflow_dispatch).
on:
  push:
    tags: ['v*']
    # (13.10, 0.60) une session Claude ne peut pousser que sa branche (ni tag, ni lancement à la main) : sur une branche glob/**, un commit
    # dont le message contient « [build] » lance aussi le build (« [widgets] » : avec les widgets). Les autres pushes ne lancent rien.
    branches: ['glob/**']
  workflow_dispatch:
    inputs:
      regenerer_profil: { description: 'régénérer le profil de signature (après un changement de capabilities)', type: boolean, default: false }
      vlc: { description: "construire avec le lecteur VLC (MKV, DTS, sous-titres ; le lecteur intégré, en repli d'Apple)", type: boolean, default: false }
      widgets: { description: "construire avec les widgets (extension PloxionWidgets ; ch.j0bot.ploxi0n.widgets doit avoir le groupe group.ch.j0bot.ploxi0n)", type: boolean, default: false }
concurrency:
  # seul un VRAI build annule le précédent : un push sans « [build] » (jobs sautés) a son propre groupe et ne coupe rien (13.10 : un tel
  # push avait annulé le build de la 0.61)
  group: ${{ (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build]')) && 'ios-testflight' || format('ios-sans-build-{0}', github.sha) }}
  cancel-in-progress: true
jobs:
  tests:
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
  testflight:
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MATCH_PAT: ${{ secrets.MATCH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      # match lit le dépôt des certificats avec un jeton (MATCH_PAT : accès « Contents » à ploxi0n-certificats seulement)
      - name: Accès au dépôt des certificats
        if: ${{ env.MATCH_PAT != '' }}
        run: |
          b64=$(printf 'x-access-token:%s' "$MATCH_PAT" | base64 | tr -d '\n')
          echo "::add-mask::$b64"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$b64" >> "$GITHUB_ENV"
          echo "MATCH_GIT_URL=https://github.com/J0bot/ploxi0n-certificats.git" >> "$GITHUB_ENV"
      # les paquets Swift (SPM) résolus AVANT fastlane : sinon « xcodebuild -showBuildSettings timed out » (0.23, un nouveau plugin à télécharger)
      - name: Paquets Swift
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App
      - run: bundle exec fastlane beta
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '6'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TESTFLIGHT_EMAIL: ${{ secrets.TESTFLIGHT_EMAIL }}
          MATCH_FORCE: ${{ inputs.regenerer_profil }}
          # les widgets : l'entrée du lancement manuel, ou la variable du dépôt PLOXI0N_WIDGETS=1 (Settings › Variables) pour chaque push
          PLOXI0N_WIDGETS: ${{ (inputs.widgets || contains(github.event.head_commit.message, '[widgets]')) && '1' || vars.PLOXI0N_WIDGETS }}
          # le lecteur VLC : l'entrée du lancement manuel, ou la variable du dépôt PLOXI0N_VLC=1
          PLOXI0N_VLC: ${{ inputs.vlc && '1' || vars.PLOXI0N_VLC }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: build-logs, path: ~/Library/Logs/gym, if-no-files-found: ignore }
