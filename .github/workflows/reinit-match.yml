name: Reinit Match

on:
  workflow_dispatch:

jobs:
  reinit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Wipe & reinit match
        run: |
          bundle exec fastlane match appstore \
            -r "https://x-access-token:${{ secrets.MATCH_PAT }}@github.com/j0bot/ploxi0n-certificats.git" \
            --force
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
